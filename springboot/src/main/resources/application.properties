spring.application.name=HAIBAZO Book Reviews API

# Server configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Database configuration - Supabase
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.olrnadiqscakgegyqfls}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:x2L-#9LneSp-3s4}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}

# H2 Console (Disabled)
spring.h2.console.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.haibazo.bookreviews=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
